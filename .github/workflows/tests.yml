name: Tests

on:
  push:
    branches:
      - master
  pull_request:

env:
  BATS_VERSION: v1.7.0

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-10.15
          - os: macos-11
          - os: macos-12
          - os: ubuntu-18.04
            elvish: v0.17.0
          - os: ubuntu-20.04
            elvish: v0.18.0
          - os: ubuntu-22.04
            elvish: v0.18.0

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install test dependencies
        if: runner.os == 'macos'
        run: brew install coreutils fish elvish

      - name: Install test dependencies
        if: runner.os == 'linux'
        run: |
          sudo add-apt-repository -y ppa:fish-shell/nightly-master
          sudo apt-get update
          sudo apt-get -y install fish curl

          # Download elvish binary and add to path
          curl https://dl.elv.sh/linux-amd64/elvish-${{ matrix.elvish }}.tar.gz -o elvish-${{ matrix.elvish }}.tar.gz
          tar xzf elvish-${{ matrix.elvish }}.tar.gz
          rm elvish-${{ matrix.elvish }}.tar.gz
          mkdir -p "$HOME/bin"
          mv elvish-${{ matrix.elvish }} "$HOME/bin/elvish"
          echo "$HOME/bin" >>"$GITHUB_PATH"

      - name: Install bats
        run: |
          git clone --depth 1 --branch "${{ env.BATS_VERSION }}" https://github.com/bats-core/bats-core.git $HOME/bats-core
          echo "$HOME/bats-core/bin" >>"$GITHUB_PATH"

      - name: Run tests
        run: bats test
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
